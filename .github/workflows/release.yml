name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z)"
        required: true
      prerelease:
        description: "Pre-release (HACS shows it only to who asks for betas)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: write   # the GitHub release
      id-token: write   # keyless cosign signature
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest -q
      - run: python scripts/package.py --version "$VERSION" --out dist
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: |
          for f in dist/feedrion.zip dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          # HACS reads the version from the TAG and installs feedrion.zip.
          gh release create "v$VERSION" dist/* "${flags[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Feedrion for Home Assistant $VERSION" \
            --notes "Install or update through HACS. Signatures: cosign keyless (*.sigstore.json)."
